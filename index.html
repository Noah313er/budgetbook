<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Haushaltsbuch</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <style>
    :root {
      --bg: #0b0d13;
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.16);
      --text: #ffffff;
      --subtext: rgba(255, 255, 255, 0.65);
      --input-bg: rgba(255, 255, 255, 0.06);
      --accent: #0a84ff;
      --income: #30d158;
      --expense: #ff453a;
      --glass-blur: blur(28px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 15%, rgba(10, 132, 255, 0.28) 0%, transparent 45%),
        radial-gradient(circle at 90% 85%, rgba(255, 214, 10, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(48, 209, 88, 0.10) 0%, transparent 55%);
      background-attachment: fixed;
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 1.2rem 1rem;
    }

    .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 1rem; }

    .card {
      background: var(--card-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-radius: 20px;
      padding: 1.1rem;
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    h1 { 
      font-size: 1.5rem; 
      text-align: center; 
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 0.2rem;
    }

    input, select, textarea, button {
      width: 100%;
      padding: 0.8rem;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: var(--input-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    button { 
      background: linear-gradient(135deg, #0a84ff, #0056b3); 
      color: #fff; 
      font-weight: 600; 
      cursor: pointer; 
      border: none;
      box-shadow: 0 4px 15px rgba(10, 132, 255, 0.35);
    }

    .type-selector { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
    .type-btn {
      flex: 1;
      padding: 0.6rem;
      background: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      font-weight: 600;
    }
    .type-btn.active-expense { 
      background: linear-gradient(135deg, rgba(255, 69, 58, 0.9), rgba(215, 0, 21, 0.9)); 
      color: #fff; 
      border-color: rgba(255, 69, 58, 0.5); 
    }
    .type-btn.active-income { 
      background: linear-gradient(135deg, rgba(48, 209, 88, 0.9), rgba(36, 138, 61, 0.9)); 
      color: #fff; 
      border-color: rgba(48, 209, 88, 0.5); 
    }

    .dashboard { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; text-align: center; }
    .stat-label { font-size: 0.75rem; color: var(--subtext); margin-bottom: 0.2rem; }
    .stat-val { font-size: 1rem; font-weight: 700; }

    .nav-bar { display: flex; justify-content: space-between; align-items: center; }
    .nav-btn { background: none; border: none; color: var(--accent); font-size: 1.5rem; cursor: pointer; width: auto; padding: 0.2rem 0.8rem; box-shadow: none; }

    .entry-item { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 0.75rem 0; 
      border-bottom: 1px solid rgba(255, 255, 255, 0.08); 
    }
    .entry-item:last-child { border-bottom: none; }
    .entry-info { display: flex; flex-direction: column; gap: 0.2rem; }
    .entry-cat { font-weight: 600; font-size: 0.95rem; }
    .entry-note { font-size: 0.8rem; color: var(--subtext); }
    .entry-date { font-size: 0.75rem; color: var(--subtext); }
    .entry-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 0.3rem; }
    .amount { font-weight: 700; font-size: 1rem; }
    .amount.income { color: var(--income); }
    .amount.expense { color: var(--expense); }
    .del-btn { background: none; border: none; color: var(--expense); font-size: 0.75rem; cursor: pointer; width: auto; padding: 0; box-shadow: none; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="app-container">
  <h1>Haushaltsbuch</h1>

  <!-- Master-Passwort Tresor -->
  <div id="authSection" class="card" style="display: flex; flex-direction: column; gap: 0.75rem;">
    <p style="font-size: 0.9rem; color: var(--subtext);">Gib dein Master-Passwort ein, um deine Finanzdaten lokal zu entschlüsseln.</p>
    <input type="password" id="masterPassword" placeholder="Master-Passwort" onkeydown="if(event.key === 'Enter') unlockVault()">
    <button type="button" onclick="unlockVault()">Tresor öffnen</button>
  </div>

  <!-- Hauptbereich -->
  <div id="mainSection" class="hidden" style="display: flex; flex-direction: column; gap: 1rem;">
    
    <!-- Monatsauswahl -->
    <div class="card nav-bar">
      <button type="button" class="nav-btn" onclick="changeMonth(-1)">‹</button>
      <div id="currentMonthLabel" style="font-weight: 600; font-size: 1.1rem;"></div>
      <button type="button" class="nav-btn" onclick="changeMonth(1)">›</button>
    </div>

    <!-- Übersicht Dashboard -->
    <div class="card dashboard">
      <div>
        <div class="stat-label">Einnahmen</div>
        <div id="totalIncome" class="stat-val" style="color: var(--income);">0,00 €</div>
      </div>
      <div>
        <div class="stat-label">Ausgaben</div>
        <div id="totalExpense" class="stat-val" style="color: var(--expense);">0,00 €</div>
      </div>
      <div>
        <div class="stat-label">Saldo</div>
        <div id="totalBalance" class="stat-val">0,00 €</div>
      </div>
    </div>

    <!-- Neue Buchung -->
    <div class="card" style="display: flex; flex-direction: column; gap: 0.6rem;">
      <div class="type-selector">
        <button type="button" id="btnExpense" class="type-btn active-expense" onclick="setType('Ausgabe')">Ausgabe</button>
        <button type="button" id="btnIncome" class="type-btn" onclick="setType('Einnahme')">Einnahme</button>
      </div>

      <div style="display: flex; gap: 0.5rem;">
        <input type="number" id="inputAmount" step="0.01" placeholder="Betrag in €" style="flex: 1;">
        <input type="date" id="inputDate" style="flex: 1;">
      </div>

      <!-- Kategorie-Dropdown & Neuer Kategorie-Button -->
      <div style="display: flex; gap: 0.5rem; align-items: center;">
        <select id="inputCategory" style="flex: 1;"></select>
        <button type="button" onclick="addNewCategoryPrompt()" title="Kategorie hinzufügen" style="width: auto; padding: 0.8rem 1rem; font-size: 1rem; background: var(--input-bg); border: 1px solid var(--card-border); box-shadow: none;">➕</button>
      </div>

      <input type="text" id="inputNote" placeholder="Notiz / Beschreibung (optional)">

      <!-- Wiederkehrende Optionen mit händischem Zahlenfeld -->
      <div style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.2rem;">
        <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--subtext); cursor: pointer;">
          <input type="checkbox" id="inputRecurring" style="width: auto;" onchange="toggleRecurringOptions()">
          Wiederkehrende Buchung (Fixkosten/Abo)
        </label>

        <div id="recurringOptions" style="display: none; gap: 0.5rem; align-items: center;">
          <label for="recurringMonths" style="font-size: 0.8rem; color: var(--subtext); white-space: nowrap;">Dauer in Monaten:</label>
          <input type="number" id="recurringMonths" min="2" max="120" value="12" style="width: 100px;">
        </div>
      </div>

      <button type="button" onclick="saveEntry()">Buchen</button>
    </div>

    <!-- Buchungsliste -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
        <h3 style="font-size: 1rem;">Buchungen</h3>
        <button type="button" onclick="promptCopyType()" style="width: auto; padding: 0.4rem 0.8rem; font-size: 0.8rem; background: var(--input-bg); color: var(--text); border: 1px solid var(--card-border); box-shadow: none;">
          📋 Für Excel kopieren
        </button>
      </div>
      <div id="entriesList"></div>
    </div>
  </div>
</div>

<script>
  // 1. SUPABASE KONFIGURATION
  const SUPABASE_URL = "https://pbcoovqhidaiuuetugul.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBiY29vdnFoaWRhaXV1ZXR1Z3VsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzMDkwNzMsImV4cCI6MjEwNjg4NTA3M30.2gz4dRmYJgSdQAtXrsbIohYpJVJWup_bNseIf2-iwuc";
  let supabase = null;

  function getSupabase() {
    if (!supabase) {
      const clientCreator = (window.supabase && window.supabase.createClient) || (window.supabaseClient && window.supabaseClient.createClient);
      if (!clientCreator) {
        throw new Error("Supabase-Bibliothek konnte nicht geladen werden.");
      }
      supabase = clientCreator(SUPABASE_URL, SUPABASE_KEY);
    }
    return supabase;
  }

  // 2. KATEGORIEN
  const defaultExpenseCategories = [
    "Miete", "Versicherung", "Semesterbeitrag", "D-Ticket", "Haushalt", 
    "Essen/Trinken", "Bad/Pflege", "Unterhaltung", "Strom/Telefon", "Sonstiges"
  ];
  const defaultIncomeCategories = ["Lohn", "Ausschenken", "Geschenke", "Sonstiges"];

  function getCustomCategories(type) {
    const key = type === "Ausgabe" ? "custom_expense_cats" : "custom_income_cats";
    return JSON.parse(localStorage.getItem(key) || "[]");
  }

  function saveCustomCategory(type, name) {
    const key = type === "Ausgabe" ? "custom_expense_cats" : "custom_income_cats";
    const existing = getCustomCategories(type);
    if (!existing.includes(name)) {
      existing.push(name);
      localStorage.setItem(key, JSON.stringify(existing));
    }
  }

  let currentType = "Ausgabe";
  let activeMonth = new Date().getMonth();
  let activeYear = new Date().getFullYear();
  let cryptoKey = null;
  let allEntries = [];

  // 3. KRYPTOGRAFIE (AES-GCM 256)
  async function deriveKey(password) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
    );
    const salt = enc.encode("haushaltsbuch-secure-salt-2026");
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      false,
      ["encrypt", "decrypt"]
    );
  }

  async function encryptData(dataObj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const encoded = new TextEncoder().encode(JSON.stringify(dataObj));
    const ciphertext = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, cryptoKey, encoded);
    return {
      ciphertext: btoa(String.fromCharCode(...new Uint8Array(ciphertext))),
      iv: btoa(String.fromCharCode(...iv))
    };
  }

  async function decryptData(ciphertextBase64, ivBase64) {
    try {
      const iv = new Uint8Array(atob(ivBase64).split("").map(c => c.charCodeAt(0)));
      const data = new Uint8Array(atob(ciphertextBase64).split("").map(c => c.charCodeAt(0)));
      const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, cryptoKey, data);
      return JSON.parse(new TextDecoder().decode(decrypted));
    } catch {
      return null;
    }
  }

  // 4. UI LOGIK
  function setType(type) {
    currentType = type;
    const btnExp = document.getElementById("btnExpense");
    const btnInc = document.getElementById("btnIncome");
    if (type === "Ausgabe") {
      btnExp.className = "type-btn active-expense";
      btnInc.className = "type-btn";
    } else {
      btnExp.className = "type-btn";
      btnInc.className = "type-btn active-income";
    }
    updateCategoryDropdown();
  }

  function updateCategoryDropdown(selectedVal = null) {
    const select = document.getElementById("inputCategory");
    select.innerHTML = "";
    const defaults = currentType === "Ausgabe" ? defaultExpenseCategories : defaultIncomeCategories;
    const custom = getCustomCategories(currentType);
    const combined = [...defaults, ...custom];

    combined.forEach(c => {
      const opt = document.createElement("option");
      opt.value = c;
      opt.textContent = c;
      if (selectedVal && c === selectedVal) opt.selected = true;
      select.appendChild(opt);
    });
  }

  function addNewCategoryPrompt() {
    const newCat = prompt(`Neue Kategorie für ${currentType}n eingeben:`);
    if (!newCat || !newCat.trim()) return;
    const cleaned = newCat.trim();
    saveCustomCategory(currentType, cleaned);
    updateCategoryDropdown(cleaned);
  }

  function toggleRecurringOptions() {
    const isChecked = document.getElementById("inputRecurring").checked;
    const optDiv = document.getElementById("recurringOptions");
    optDiv.style.display = isChecked ? "flex" : "none";
  }

  function changeMonth(delta) {
    activeMonth += delta;
    if (activeMonth < 0) { activeMonth = 11; activeYear--; }
    else if (activeMonth > 11) { activeMonth = 0; activeYear++; }
    render();
  }

  async function unlockVault() {
    try {
      const pwd = document.getElementById("masterPassword").value;
      if (!pwd) return alert("Bitte Passwort angeben.");
      getSupabase();
      cryptoKey = await deriveKey(pwd);
      document.getElementById("authSection").classList.add("hidden");
      document.getElementById("mainSection").classList.remove("hidden");

      document.getElementById("inputDate").valueAsDate = new Date();
      updateCategoryDropdown();
      await loadData();
      subscribeRealtime();
    } catch (err) {
      alert("Fehler beim Starten: " + err.message);
    }
  }

  async function loadData() {
    const { data, error } = await getSupabase().from("secure_budget").select("*").order("created_at", { ascending: false });
    if (error) return console.error(error);
    allEntries = [];
    for (const row of data) {
      const dec = await decryptData(row.ciphertext, row.iv);
      if (dec) allEntries.push({ id: row.id, ...dec });
    }
    render();
  }

  async function saveEntry() {
    const amountVal = parseFloat(document.getElementById("inputAmount").value);
    const dateVal = document.getElementById("inputDate").value;
    const categoryVal = document.getElementById("inputCategory").value;
    const noteVal = document.getElementById("inputNote").value.trim();
    const isRecurring = document.getElementById("inputRecurring").checked;
    
    const monthsInput = document.getElementById("recurringMonths");
    let recurringMonths = 1;
    if (isRecurring && monthsInput) {
      recurringMonths = parseInt(monthsInput.value, 10);
      if (isNaN(recurringMonths) || recurringMonths < 1) recurringMonths = 1;
    }

    if (!amountVal || amountVal <= 0 || !dateVal) {
      return alert("Bitte gültigen Betrag und Datum eingeben.");
    }

    const [year, month, day] = dateVal.split("-").map(Number);
    const recordsToInsert = [];
    // Eindeutige Serien-ID für wiederkehrende Buchungen
    const recurringId = isRecurring ? (crypto.randomUUID ? crypto.randomUUID() : "rec_" + Date.now() + "_" + Math.random()) : null;

    for (let i = 0; i < recurringMonths; i++) {
      const curDate = new Date(year, (month - 1) + i, day);
      const yyyy = curDate.getFullYear();
      const mm = String(curDate.getMonth() + 1).padStart(2, "0");
      const dd = String(curDate.getDate()).padStart(2, "0");
      const formattedDate = `${yyyy}-${mm}-${dd}`;

      const entryData = {
        amount: amountVal,
        type: currentType,
        date: formattedDate,
        category: categoryVal,
        note: noteVal,
        recurring: isRecurring,
        recurringId: recurringId
      };

      const encrypted = await encryptData(entryData);
      recordsToInsert.push(encrypted);
    }

    const { error } = await getSupabase().from("secure_budget").insert(recordsToInsert);
    if (error) {
      alert("Fehler beim Speichern: " + error.message);
    } else {
      document.getElementById("inputAmount").value = "";
      document.getElementById("inputNote").value = "";
      document.getElementById("inputRecurring").checked = false;
      document.getElementById("recurringOptions").style.display = "none";
      await loadData();
      alert(isRecurring ? `${recurringMonths} Monate erfolgreich verbucht!` : "Eintrag gespeichert!");
    }
  }

  // Löschfunktion mit Nachfrage für nachfolgende Monate
  async function deleteEntry(id) {
    const entry = allEntries.find(e => e.id === id);
    if (!entry) return;

    let idsToDelete = [id];

    if (entry.recurring && entry.recurringId) {
      const choice = confirm("Dies ist eine wiederkehrende Buchung.\n\nSollen auch alle FOLGENDEN Monate ab diesem Datum gelöscht werden?\n\n[OK] = Diesen und alle Folgemonate löschen\n[Abbrechen] = Nur diesen einen Monat löschen");
      if (choice) {
        // Löscht diesen Eintrag sowie alle Folgeeinträge derselben Serie
        idsToDelete = allEntries
          .filter(e => e.recurringId === entry.recurringId && e.date >= entry.date)
          .map(e => e.id);
      }
    } else {
      if (!confirm("Diesen Eintrag wirklich löschen?")) return;
    }

    const { error } = await getSupabase().from("secure_budget").delete().in("id", idsToDelete);
    if (error) {
      alert("Fehler beim Löschen: " + error.message);
    } else {
      allEntries = allEntries.filter(e => !idsToDelete.includes(e.id));
      render();
    }
  }

  function render() {
    const monthNames = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
    document.getElementById("currentMonthLabel").textContent = `${monthNames[activeMonth]} ${activeYear}`;

    const filtered = allEntries.filter(e => {
      const parts = e.date.split("-");
      return (parseInt(parts[1], 10) - 1) === activeMonth && parseInt(parts[0], 10) === activeYear;
    });

    let inc = 0, exp = 0;
    const listEl = document.getElementById("entriesList");
    listEl.innerHTML = filtered.length === 0 ? '<div style="color: var(--subtext); text-align: center; padding: 1rem 0;">Keine Buchungen</div>' : '';

    filtered.forEach(item => {
      if (item.type === "Einnahme") inc += item.amount;
      else exp += item.amount;

      const div = document.createElement("div");
      div.className = "entry-item";
      div.innerHTML = `
        <div class="entry-info">
          <span class="entry-cat">${escapeHtml(item.category)} ${item.recurring ? "🔄" : ""}</span>
          ${item.note ? `<span class="entry-note">${escapeHtml(item.note)}</span>` : ""}
          <span class="entry-date">${item.date}</span>
        </div>
        <div class="entry-right">
          <span class="amount ${item.type === "Einnahme" ? "income" : "expense"}">
            ${item.type === "Einnahme" ? "+" : "-"}${item.amount.toFixed(2)} €
          </span>
          <button type="button" class="del-btn" onclick="deleteEntry('${item.id}')">Löschen</button>
        </div>
      `;
      listEl.appendChild(div);
    });

    document.getElementById("totalIncome").textContent = inc.toFixed(2) + " €";
    document.getElementById("totalExpense").textContent = exp.toFixed(2) + " €";
    const balance = inc - exp;
    const balEl = document.getElementById("totalBalance");
    balEl.textContent = balance.toFixed(2) + " €";
    balEl.style.color = balance >= 0 ? "var(--income)" : "var(--expense)";
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[m]));
  }

  function subscribeRealtime() {
    getSupabase().channel("secure_budget_changes")
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "secure_budget" }, async p => {
        const dec = await decryptData(p.new.ciphertext, p.new.iv);
        if (dec && !allEntries.some(e => e.id === p.new.id)) {
          allEntries.unshift({ id: p.new.id, ...dec });
          render();
        }
      })
      .on("postgres_changes", { event: "DELETE", schema: "public", table: "secure_budget" }, p => {
        allEntries = allEntries.filter(e => e.id !== p.old.id);
        render();
      })
      .subscribe();
  }

  // 5. EXCEL EXPORT (Datum | Kategorie | Betrag | Notizen)
  function promptCopyType() {
    const choice = prompt("Was möchtest du für Excel kopieren?\n\n1 = Ausgaben\n2 = Einnahmen", "1");
    if (!choice) return;

    if (choice.trim() === "1" || choice.toLowerCase().includes("ausgabe")) {
      executeCopy("Ausgabe");
    } else if (choice.trim() === "2" || choice.toLowerCase().includes("einnahme")) {
      executeCopy("Einnahme");
    } else {
      alert("Ungültige Eingabe. Bitte '1' für Ausgaben oder '2' für Einnahmen eingeben.");
    }
  }

  async function executeCopy(targetType) {
    const filtered = allEntries.filter(e => {
      const parts = e.date.split("-");
      return (parseInt(parts[1], 10) - 1) === activeMonth && 
             parseInt(parts[0], 10) === activeYear && 
             e.type === targetType;
    });

    if (filtered.length === 0) {
      return alert(`Keine ${targetType}n im ausgewählten Monat vorhanden.`);
    }

    filtered.sort((a, b) => new Date(a.date) - new Date(b.date));

    const rows = filtered.map(item => {
      const amountStr = item.amount.toFixed(2).replace('.', ',');
      return [
        item.date,
        item.category,
        amountStr,
        item.note || ""
      ].join("\t");
    });

    try {
      await navigator.clipboard.writeText(rows.join("\n"));
      alert(`${filtered.length} ${targetType}n kopiert! In Excel Zelle A anklicken und Cmd+V drücken.`);
    } catch (err) {
      alert("Kopierfehler: " + err.message);
    }
  }
</script>
</body>
</html>
